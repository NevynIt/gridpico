<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gridpico · Circuit</title>
<style>
  :root {
    color-scheme: dark;
    font: 1rem/1.5 system-ui, sans-serif;
    color: #f0f4f2;
    background: #121617;
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  main {
    width: min(calc(100% - 2rem), 48rem);
    margin: 0 auto;
    padding: clamp(1rem, 6vw, 4rem) 0;
  }
  a { color: #a3efbd; }
  h1 { margin: .65rem 0 1.3rem; font-size: clamp(2.35rem, 7vw, 3.5rem); line-height: 1.1; letter-spacing: -.045em; }
  h2 { margin: 0; font-size: clamp(1.2rem, 4vw, 1.65rem); }
  p { margin: 0; }
  .pattern {
    padding: clamp(.75rem, 4vw, 2rem);
    border: 1px solid #546461;
    border-radius: .55rem;
    background: #1b2424;
  }
  .pattern-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: .25rem 1rem;
    margin-bottom: 1rem;
  }
  .inspection { color: #bdd0c8; min-height: 1.5em; }
  .steps {
    display: grid;
    grid-template-columns: repeat(8, minmax(0, 1fr));
    gap: clamp(.2rem, 1vw, .65rem);
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .step {
    width: 100%;
    min-width: 0;
    min-height: clamp(2.75rem, 9vw, 4.75rem);
    padding: 0;
    border: 1px solid #71817d;
    border-radius: .35rem;
    color: inherit;
    background: #202929;
    font: 600 clamp(.8rem, 2vw, 1.15rem)/1 ui-monospace, monospace;
    cursor: pointer;
    touch-action: manipulation;
  }
  .step:hover { border-color: #b9d0c6; }
  :focus-visible { outline: 2px solid #def3e9; outline-offset: 3px; }
  .step:focus { outline: 2px solid #def3e9; outline-offset: -4px; }
  .transport {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: .55rem 1rem;
    margin-top: 1.35rem;
    padding-top: 1rem;
    border-top: 1px solid #546461;
  }
  .transport-controls { display: flex; flex-wrap: wrap; gap: .4rem; }
  .transport button {
    padding: .4rem .65rem;
    border: 1px dashed #6d7b78;
    border-radius: .3rem;
    color: #aebeba;
    background: transparent;
    font: inherit;
  }
  #sequencer-status { color: #cbd7d4; font-size: .9rem; }
</style>
</head>
<body>
<main>
  <nav aria-label="Gridpico"><a href="/">Gridpico home</a></nav>
  <h1>Circuit</h1>
  <section class="pattern" aria-labelledby="pattern-title">
    <header class="pattern-header">
      <h2 id="pattern-title">Track 1 · Pattern 1</h2>
      <p class="inspection" id="inspection" role="status">Choose a step or use the arrow keys.</p>
    </header>
    <ol class="steps" aria-label="Step positions">
      <li><button type="button" class="step" aria-label="Step 1 of 16">1</button></li>
      <li><button type="button" class="step" aria-label="Step 2 of 16" tabindex="-1">2</button></li>
      <li><button type="button" class="step" aria-label="Step 3 of 16" tabindex="-1">3</button></li>
      <li><button type="button" class="step" aria-label="Step 4 of 16" tabindex="-1">4</button></li>
      <li><button type="button" class="step" aria-label="Step 5 of 16" tabindex="-1">5</button></li>
      <li><button type="button" class="step" aria-label="Step 6 of 16" tabindex="-1">6</button></li>
      <li><button type="button" class="step" aria-label="Step 7 of 16" tabindex="-1">7</button></li>
      <li><button type="button" class="step" aria-label="Step 8 of 16" tabindex="-1">8</button></li>
      <li><button type="button" class="step" aria-label="Step 9 of 16" tabindex="-1">9</button></li>
      <li><button type="button" class="step" aria-label="Step 10 of 16" tabindex="-1">10</button></li>
      <li><button type="button" class="step" aria-label="Step 11 of 16" tabindex="-1">11</button></li>
      <li><button type="button" class="step" aria-label="Step 12 of 16" tabindex="-1">12</button></li>
      <li><button type="button" class="step" aria-label="Step 13 of 16" tabindex="-1">13</button></li>
      <li><button type="button" class="step" aria-label="Step 14 of 16" tabindex="-1">14</button></li>
      <li><button type="button" class="step" aria-label="Step 15 of 16" tabindex="-1">15</button></li>
      <li><button type="button" class="step" aria-label="Step 16 of 16" tabindex="-1">16</button></li>
    </ol>
    <div class="transport">
      <div class="transport-controls" role="group" aria-label="Transport and pitch" aria-describedby="sequencer-status">
        <button type="button" disabled>Play</button>
        <button type="button" disabled>Stop</button>
        <button type="button" disabled>Edit pitch</button>
      </div>
      <p id="sequencer-status">Sequencer unavailable on this router</p>
    </div>
  </section>
</main>
<script>
"use strict";

const grid = document.querySelector(".steps");
const steps = [...grid.querySelectorAll(".step")];
const inspection = document.querySelector("#inspection");
const offsets = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -8, ArrowDown: 8 };
let tabStop = steps[0];

grid.addEventListener("focusin", event => {
  const button = event.target;
  tabStop.tabIndex = -1;
  button.tabIndex = 0;
  tabStop = button;
  inspection.textContent = button.getAttribute("aria-label");
});

grid.addEventListener("click", event => {
  if (event.target.matches(".step")) event.target.focus();
});

grid.addEventListener("keydown", event => {
  const index = steps.indexOf(event.target);
  const key = event.key;
  if (key === "Home" || key === "End") {
    event.preventDefault();
    steps[key === "Home" ? 0 : steps.length - 1].focus();
  } else if (Object.hasOwn(offsets, key)) {
    event.preventDefault();
    if ((key === "ArrowLeft" && index % 8 === 0) || (key === "ArrowRight" && index % 8 === 7)) return;
    steps[index + offsets[key]]?.focus();
  }
});
</script>
</body>
</html>
