<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gridpico</title>
  <style>
    :root {
      color-scheme: dark;
      font: 1rem/1.5 system-ui, sans-serif;
      background: #121617;
      color: #eef1ef;
    }
    body { margin: 0; }
    main { max-width: 48rem; margin: 0 auto; padding: clamp(1.25rem, 6vw, 4rem); }
    h1 { margin: 0 0 1.4rem; font-size: clamp(2rem, 5vw, 3rem); }
    nav ul {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr));
      gap: 1rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    a {
      display: block;
      height: 100%;
      box-sizing: border-box;
      padding: 1rem 1.25rem;
      border: 1px solid #66726e;
      border-radius: .45rem;
      background: #242b2a;
      color: inherit;
      text-decoration: none;
    }
    a:hover { background: #344540; }
    a:focus-visible { outline: 2px solid #8fe0b6; outline-offset: 3px; }
    a strong { display: block; margin-bottom: .25rem; font-size: 1.125rem; }
    a span { color: #b8c8c1; }
  </style>
</head>
<body>
  <main>
    <h1>Gridpico</h1>
    <nav aria-label="Gridpico tools">
      <ul>
        <li><a href="/apc/"><strong>Web APC</strong><span>Play the keybed and use the APC controls.</span></a></li>
        <li><a href="/diagnostics/"><strong>Diagnostics</strong><span>Inspect ports, configure routes, and test APC LEDs.</span></a></li>
        <li data-optional-tool="fm"><a href="/fm/"><strong>FM Instrument</strong><span>Play an FM voice from a selected MIDI input.</span></a></li>
      </ul>
    </nav>
  </main>
</body>
</html>
